cross_requirement_boundaries:
  counter_vs_counter_change:
    finding: Observed counter-spell/ability evidence is distinct from counter placement evidence; names can be confused.
    examples: *id009
  draw_vs_zone_transition:
    finding: Draw is mapped as its own operation; some cards also have separate zone movement evidence.
    examples: *id010
  discard_vs_zone_transition:
    finding: Discard is separately represented; co-occurrence with movement does not imply interchangeability.
    examples: *id011
  shuffle_vs_same_zone:
    finding: Shuffle is a distinct action, not an inferred Library-to-Library transition; same-zone repositioning
      is excluded by the 0.2.1 guard.
    examples: *id012
  gain_vs_lose_life:
    finding: Opposite direction operations have separate identifiers; a signed abstraction has no demonstrated analysis
      benefit here.
    examples: *id013
  tap_vs_untap:
    finding: Opposite state changes remain separate; observed symmetry alone does not justify merging.
    examples: *id014
